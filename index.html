<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/shorter-icon-512.png" />
    <link rel="apple-touch-icon" href="/brand/shorter-icon-512.png" />
    <meta name="description" content="Get a hair cut, wherever, whenever." />
    <meta name="theme-color" content="#000000" />
    <!-- Added so the site can be added to a phone's home screen and opened the
         way the app opens: full screen, its own icon, no browser furniture. The
         icons and the colours are the same ones the built app uses, so the two
         cannot drift apart. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Shorter" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Shorter — Get a hair cut, wherever, whenever</title>
    <script>
      if (!crypto.randomUUID) {
        crypto.randomUUID = function() {
          return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            const r = Math.random() * 16 | 0, v = c === 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
          });
        };
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
